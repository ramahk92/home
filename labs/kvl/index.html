<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirchhoff's Voltage Law (KVL) Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #38bdf8;
      font-size: 2rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .lab-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    @media (max-width: 820px) {
      .lab-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    .badge {
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .badge-v { background: #0284c7; color: #e0f2fe; }
    .badge-r1 { background: #16a34a; color: #dcfce7; }
    .badge-r2 { background: #d97706; color: #fef3c7; }
    .badge-r3 { background: #9333ea; color: #f3e8ff; }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #475569;
      outline: none;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .kvl-summary {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      margin-top: 14px;
    }

    .kvl-equation {
      font-family: monospace;
      font-size: 0.88rem;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 8px;
    }

    .kvl-check {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      color: #4ade80;
    }

    .readout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .readout-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      border: 1px solid #334155;
    }

    .readout-box .title {
      font-size: 0.72rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .readout-box .val {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 4px;
      font-family: monospace;
    }

    .val-i { color: #facc15; }
    .val-v1 { color: #4ade80; }
    .val-v2 { color: #fbbf24; }
    .val-v3 { color: #c084fc; }

    .canvas-container {
      width: 100%;
      height: 100%;
      min-height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      background-color: #020617;
      border-radius: 8px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <header>
    <h1>Kirchhoff's Voltage Law (KVL)</h1>
    <p class="subtitle">Around any closed loop: <strong>∑ V = 0 &nbsp;⇒&nbsp; V<sub>S</sub> - V<sub>1</sub> - V<sub>2</sub> - V<sub>3</sub> = 0</strong></p>
  </header>

  <div class="lab-container">
    <!-- Controls Panel -->
    <div class="card">
      <div class="control-group">
        <label for="vSource">
          <span>Source Voltage (V<sub>S</sub>)</span>
          <span class="badge badge-v" id="vsVal">12.0 V</span>
        </label>
        <input type="range" id="vSource" min="1" max="30" step="0.5" value="12">
      </div>

      <div class="control-group">
        <label for="r1">
          <span>Resistor R<sub>1</sub></span>
          <span class="badge badge-r1" id="r1Val">100 Ω</span>
        </label>
        <input type="range" id="r1" min="10" max="500" step="10" value="100">
      </div>

      <div class="control-group">
        <label for="r2">
          <span>Resistor R<sub>2</sub></span>
          <span class="badge badge-r2" id="r2Val">220 Ω</span>
        </label>
        <input type="range" id="r2" min="10" max="500" step="10" value="220">
      </div>

      <div class="control-group">
        <label for="r3">
          <span>Resistor R<sub>3</sub></span>
          <span class="badge badge-r3" id="r3Val">180 Ω</span>
        </label>
        <input type="range" id="r3" min="10" max="500" step="10" value="180">
      </div>

      <div class="readout-grid">
        <div class="readout-box">
          <div class="title">Current (I)</div>
          <div class="val val-i" id="iVal">24.0 mA</div>
        </div>
        <div class="readout-box">
          <div class="title">Drop V<sub>1</sub> (R<sub>1</sub>)</div>
          <div class="val val-v1" id="v1Val">2.40 V</div>
        </div>
        <div class="readout-box">
          <div class="title">Drop V<sub>2</sub> (R<sub>2</sub>)</div>
          <div class="val val-v2" id="v2Val">5.28 V</div>
        </div>
        <div class="readout-box">
          <div class="title">Drop V<sub>3</sub> (R<sub>3</sub>)</div>
          <div class="val val-v3" id="v3Val">4.32 V</div>
        </div>
      </div>

      <div class="kvl-summary">
        <div class="kvl-equation">V<sub>S</sub> - (V<sub>1</sub> + V<sub>2</sub> + V<sub>3</sub>) = 0</div>
        <div class="kvl-check" id="kvlCheck">12.00 - 12.00 = 0.00 V</div>
      </div>
    </div>

    <!-- Canvas Visualization -->
    <div class="card">
      <div class="canvas-container">
        <canvas id="kvlCanvas" width="580" height="420"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const vsInput = document.getElementById('vSource');
    const r1Input = document.getElementById('r1');
    const r2Input = document.getElementById('r2');
    const r3Input = document.getElementById('r3');

    const vsVal = document.getElementById('vsVal');
    const r1Val = document.getElementById('r1Val');
    const r2Val = document.getElementById('r2Val');
    const r3Val = document.getElementById('r3Val');

    const iVal = document.getElementById('iVal');
    const v1Val = document.getElementById('v1Val');
    const v2Val = document.getElementById('v2Val');
    const v3Val = document.getElementById('v3Val');
    const kvlCheck = document.getElementById('kvlCheck');

    const canvas = document.getElementById('kvlCanvas');
    const ctx = canvas.getContext('2d');

    let electronOffset = 0;

    function calculateKVL() {
      const Vs = parseFloat(vsInput.value);
      const R1 = parseFloat(r1Input.value);
      const R2 = parseFloat(r2Input.value);
      const R3 = parseFloat(r3Input.value);

      const Rtotal = R1 + R2 + R3;
      const I = Vs / Rtotal; // Amperes

      const V1 = I * R1;
      const V2 = I * R2;
      const V3 = I * R3;
      const Vsum = V1 + V2 + V3;
      const kvlResidual = Vs - Vsum;

      // Update UI Labels
      vsVal.textContent = Vs.toFixed(1) + ' V';
      r1Val.textContent = Math.round(R1) + ' Ω';
      r2Val.textContent = Math.round(R2) + ' Ω';
      r3Val.textContent = Math.round(R3) + ' Ω';

      iVal.textContent = (I >= 1) ? I.toFixed(2) + ' A' : (I * 1000).toFixed(1) + ' mA';
      v1Val.textContent = V1.toFixed(2) + ' V';
      v2Val.textContent = V2.toFixed(2) + ' V';
      v3Val.textContent = V3.toFixed(2) + ' V';

      kvlCheck.textContent = `${Vs.toFixed(2)} - ${Vsum.toFixed(2)} = ${kvlResidual.toFixed(2)} V`;

      return { Vs, R1, R2, R3, I, V1, V2, V3 };
    }

    function drawResistorZigZag(x, y, isHorizontal, mainColor, labelText, valText) {
      ctx.save();
      ctx.translate(x, y);

      // Background gap
      ctx.fillStyle = '#020617';
      if (isHorizontal) {
        ctx.fillRect(-35, -18, 70, 36);
      } else {
        ctx.fillRect(-18, -35, 36, 70);
      }

      // Zigzag line
      ctx.strokeStyle = mainColor;
      ctx.lineWidth = 3;
      ctx.beginPath();

      const length = 60;
      const steps = 6;
      const stepSize = length / steps;

      if (isHorizontal) {
        ctx.moveTo(-length / 2, 0);
        for (let i = 0; i <= steps; i++) {
          const offset = (i % 2 === 0) ? -10 : 10;
          ctx.lineTo((-length / 2) + i * stepSize, offset);
        }
        ctx.lineTo(length / 2, 0);
      } else {
        ctx.moveTo(0, -length / 2);
        for (let i = 0; i <= steps; i++) {
          const offset = (i % 2 === 0) ? -10 : 10;
          ctx.lineTo(offset, (-length / 2) + i * stepSize);
        }
        ctx.lineTo(0, length / 2);
      }
      ctx.stroke();

      // Text Labels
      ctx.fillStyle = mainColor;
      ctx.font = 'bold 12px monospace';

      if (isHorizontal) {
        ctx.textAlign = 'center';
        ctx.fillText(labelText, 0, -22);
        ctx.fillText(valText, 0, 28);
      } else {
        ctx.textAlign = 'left';
        ctx.fillText(labelText, 20, -6);
        ctx.fillText(valText, 20, 10);
      }

      ctx.restore();
    }

    function drawCircuit() {
      const { Vs, R1, R2, R3, I, V1, V2, V3 } = calculateKVL();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const marginX = 100;
      const marginY = 80;
      const width = canvas.width - 2 * marginX;
      const height = canvas.height - 2 * marginY;

      const left = marginX;
      const right = marginX + width;
      const top = marginY;
      const bottom = marginY + height;

      // 1. Draw Closed Loop Wire
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.rect(left, top, width, height);
      ctx.stroke();

      // 2. DC Source (Left Side)
      const batteryY = top + height / 2;
      ctx.fillStyle = '#020617';
      ctx.fillRect(left - 20, batteryY - 25, 40, 50);

      // Battery Bars
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#0284c7'; // Positive
      ctx.beginPath();
      ctx.moveTo(left - 18, batteryY - 12);
      ctx.lineTo(left + 18, batteryY - 12);
      ctx.stroke();

      ctx.lineWidth = 8;
      ctx.strokeStyle = '#94a3b8'; // Negative
      ctx.beginPath();
      ctx.moveTo(left - 10, batteryY + 12);
      ctx.lineTo(left + 10, batteryY + 12);
      ctx.stroke();

      // Battery Text
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`Vs: ${Vs.toFixed(1)}V`, left - 25, batteryY + 4);

      // 3. Resistors
      // R1 on Top
      drawResistorZigZag(left + width / 2, top, true, '#22c55e', `R1: ${Math.round(R1)}Ω`, `V1: ${V1.toFixed(2)}V`);
      // R2 on Right
      drawResistorZigZag(right, top + height / 2, false, '#f59e0b', `R2: ${Math.round(R2)}Ω`, `V2: ${V2.toFixed(2)}V`);
      // R3 on Bottom
      drawResistorZigZag(left + width / 2, bottom, true, '#a855f7', `R3: ${Math.round(R3)}Ω`, `V3: ${V3.toFixed(2)}V`);

      // 4. Loop Arrow & KVL Indicator (Center)
      const centerX = left + width / 2;
      const centerY = top + height / 2;

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 35, 0, Math.PI * 1.6);
      ctx.stroke();

      // Arrow head
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(centerX + 35, centerY - 8);
      ctx.lineTo(centerX + 42, centerY + 2);
      ctx.lineTo(centerX + 28, centerY + 2);
      ctx.fill();

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('KVL Loop', centerX, centerY + 4);

      // 5. Electron Animation
      const speed = I * 120; // Animated relative to current
      electronOffset = (electronOffset + speed) % 30;

      ctx.fillStyle = '#facc15';
      const totalPerimeter = 2 * (width + height);
      const dotSpacing = 22;

      for (let p = electronOffset; p < totalPerimeter; p += dotSpacing) {
        let x, y;
        if (p < width) {
          x = left + p;
          y = top;
        } else if (p < width + height) {
          x = right;
          y = top + (p - width);
        } else if (p < 2 * width + height) {
          x = right - (p - (width + height));
          y = bottom;
        } else {
          x = left;
          y = bottom - (p - (2 * width + height));
        }

        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(drawCircuit);
    }

    // Attach Listeners
    [vsInput, r1Input, r2Input, r3Input].forEach(input => {
      input.addEventListener('input', calculateKVL);
    });

    // Start Simulation
    drawCircuit();
  </script>
</body>
</html>
