<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirchhoff's Current Law (KCL) Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #38bdf8;
      font-size: 2rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .lab-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      max-width: 1050px;
      width: 100%;
    }

    @media (max-width: 820px) {
      .lab-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    .badge {
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .badge-v { background: #0284c7; color: #e0f2fe; }
    .badge-r1 { background: #16a34a; color: #dcfce7; }
    .badge-r2 { background: #d97706; color: #fef3c7; }
    .badge-r3 { background: #9333ea; color: #f3e8ff; }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #475569;
      outline: none;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .kcl-summary {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      margin-top: 14px;
    }

    .kcl-equation {
      font-family: monospace;
      font-size: 0.88rem;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 8px;
    }

    .kcl-check {
      font-family: monospace;
      font-size: 1.05rem;
      font-weight: bold;
      text-align: center;
      color: #4ade80;
    }

    .readout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .readout-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      border: 1px solid #334155;
    }

    .readout-box .title {
      font-size: 0.72rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .readout-box .val {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 4px;
      font-family: monospace;
    }

    .val-itotal { color: #38bdf8; }
    .val-i1 { color: #4ade80; }
    .val-i2 { color: #fbbf24; }
    .val-i3 { color: #c084fc; }

    .canvas-container {
      width: 100%;
      height: 100%;
      min-height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      background-color: #020617;
      border-radius: 8px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <header>
    <h1>Kirchhoff's Current Law (KCL)</h1>
    <p class="subtitle">At any junction node: <strong>∑ I<sub>in</sub> = ∑ I<sub>out</sub> &nbsp;⇒&nbsp; I<sub>total</sub> = I<sub>1</sub> + I<sub>2</sub> + I<sub>3</sub></strong></p>
  </header>

  <div class="lab-container">
    <!-- Controls Panel -->
    <div class="card">
      <div class="control-group">
        <label for="vSource">
          <span>Source Voltage (V<sub>S</sub>)</span>
          <span class="badge badge-v" id="vsVal">12.0 V</span>
        </label>
        <input type="range" id="vSource" min="1" max="30" step="0.5" value="12">
      </div>

      <div class="control-group">
        <label for="r1">
          <span>Branch 1 Resistor (R<sub>1</sub>)</span>
          <span class="badge badge-r1" id="r1Val">100 Ω</span>
        </label>
        <input type="range" id="r1" min="20" max="500" step="10" value="100">
      </div>

      <div class="control-group">
        <label for="r2">
          <span>Branch 2 Resistor (R<sub>2</sub>)</span>
          <span class="badge badge-r2" id="r2Val">200 Ω</span>
        </label>
        <input type="range" id="r2" min="20" max="500" step="10" value="200">
      </div>

      <div class="control-group">
        <label for="r3">
          <span>Branch 3 Resistor (R<sub>3</sub>)</span>
          <span class="badge badge-r3" id="r3Val">300 Ω</span>
        </label>
        <input type="range" id="r3" min="20" max="500" step="10" value="300">
      </div>

      <div class="readout-grid">
        <div class="readout-box">
          <div class="title">I<sub>total</sub> (Supply)</div>
          <div class="val val-itotal" id="iTotalVal">220 mA</div>
        </div>
        <div class="readout-box">
          <div class="title">I<sub>1</sub> (Branch 1)</div>
          <div class="val val-i1" id="i1Val">120 mA</div>
        </div>
        <div class="readout-box">
          <div class="title">I<sub>2</sub> (Branch 2)</div>
          <div class="val val-i2" id="i2Val">60 mA</div>
        </div>
        <div class="readout-box">
          <div class="title">I<sub>3</sub> (Branch 3)</div>
          <div class="val val-i3" id="i3Val">40 mA</div>
        </div>
      </div>

      <div class="kcl-summary">
        <div class="kcl-equation">I<sub>total</sub> - (I<sub>1</sub> + I<sub>2</sub> + I<sub>3</sub>) = 0</div>
        <div class="kcl-check" id="kclCheck">220 - 220 = 0 mA</div>
      </div>
    </div>

    <!-- Canvas Visualization -->
    <div class="card">
      <div class="canvas-container">
        <canvas id="kclCanvas" width="600" height="440"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Inputs & Labels
    const vsInput = document.getElementById('vSource');
    const r1Input = document.getElementById('r1');
    const r2Input = document.getElementById('r2');
    const r3Input = document.getElementById('r3');

    const vsVal = document.getElementById('vsVal');
    const r1Val = document.getElementById('r1Val');
    const r2Val = document.getElementById('r2Val');
    const r3Val = document.getElementById('r3Val');

    const iTotalVal = document.getElementById('iTotalVal');
    const i1Val = document.getElementById('i1Val');
    const i2Val = document.getElementById('i2Val');
    const i3Val = document.getElementById('i3Val');
    const kclCheck = document.getElementById('kclCheck');

    const canvas = document.getElementById('kclCanvas');
    const ctx = canvas.getContext('2d');

    // Animation Offsets for Each Path
    let mainOffset = 0;
    let b1Offset = 0;
    let b2Offset = 0;
    let b3Offset = 0;

    function formatCurrent(I) {
      return (I >= 1) ? I.toFixed(2) + ' A' : (I * 1000).toFixed(0) + ' mA';
    }

    function calculateKCL() {
      const Vs = parseFloat(vsInput.value);
      const R1 = parseFloat(r1Input.value);
      const R2 = parseFloat(r2Input.value);
      const R3 = parseFloat(r3Input.value);

      // Parallel Current Calculations
      const I1 = Vs / R1;
      const I2 = Vs / R2;
      const I3 = Vs / R3;
      const Itotal = I1 + I2 + I3;

      // Update UI Text
      vsVal.textContent = Vs.toFixed(1) + ' V';
      r1Val.textContent = Math.round(R1) + ' Ω';
      r2Val.textContent = Math.round(R2) + ' Ω';
      r3Val.textContent = Math.round(R3) + ' Ω';

      iTotalVal.textContent = formatCurrent(Itotal);
      i1Val.textContent = formatCurrent(I1);
      i2Val.textContent = formatCurrent(I2);
      i3Val.textContent = formatCurrent(I3);

      const totalMA = (Itotal * 1000).toFixed(1);
      const sumMA = ((I1 + I2 + I3) * 1000).toFixed(1);
      const diff = (totalMA - sumMA).toFixed(1);
      kclCheck.textContent = `${totalMA} - ${sumMA} = ${diff} mA`;

      return { Vs, R1, R2, R3, Itotal, I1, I2, I3 };
    }

    function drawResistor(x, y, label, val, color) {
      ctx.save();
      ctx.translate(x, y);

      // Gap background
      ctx.fillStyle = '#020617';
      ctx.fillRect(-18, -30, 36, 60);

      // Zig-zag symbol
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -30);
      const steps = 6;
      const stepSize = 60 / steps;
      for (let i = 0; i <= steps; i++) {
        const xOffset = (i % 2 === 0) ? -10 : 10;
        ctx.lineTo(xOffset, -30 + i * stepSize);
      }
      ctx.lineTo(0, 30);
      ctx.stroke();

      // Label text
      ctx.fillStyle = color;
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`${label}: ${val}Ω`, 16, 4);

      ctx.restore();
    }

    function drawDots(path, current, offsetRef) {
      if (current <= 0) return;

      const speed = current * 80;
      offsetRef.val = (offsetRef.val + speed) % 20;

      ctx.fillStyle = '#facc15';

      let totalLength = 0;
      let segments = [];

      for (let i = 0; i < path.length - 1; i++) {
        const p1 = path[i];
        const p2 = path[i + 1];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy);
        segments.push({ p1, p2, dx, dy, len });
        totalLength += len;
      }

      for (let d = offsetRef.val; d < totalLength; d += 20) {
        let accum = 0;
        for (let seg of segments) {
          if (d >= accum && d <= accum + seg.len) {
            const frac = (d - accum) / seg.len;
            const x = seg.p1.x + frac * seg.dx;
            const y = seg.p1.y + frac * seg.dy;
            ctx.beginPath();
            ctx.arc(x, y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            break;
          }
          accum += seg.len;
        }
      }
    }

    let mainAnim = { val: 0 };
    let b1Anim = { val: 0 };
    let b2Anim = { val: 0 };
    let b3Anim = { val: 0 };

    function drawCircuit() {
      const data = calculateKCL();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const leftX = 80;
      const nodeAX = 220;
      const b1X = 300;
      const b2X = 420;
      const b3X = 520;

      const topY = 70;
      const botY = 370;
      const batY = (topY + botY) / 2;

      // 1. Draw Wires
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 4;

      // Main Supply Loop Wires
      ctx.beginPath();
      ctx.moveTo(leftX, topY); ctx.lineTo(b3X, topY); // Top main line
      ctx.moveTo(leftX, botY); ctx.lineTo(b3X, botY); // Bottom main line
      ctx.moveTo(leftX, topY); ctx.lineTo(leftX, botY); // Left supply leg
      ctx.stroke();

      // Parallel Branch Wires
      [b1X, b2X, b3X].forEach(x => {
        ctx.beginPath();
        ctx.moveTo(x, topY); ctx.lineTo(x, botY);
        ctx.stroke();
      });

      // 2. DC Source Symbol
      ctx.fillStyle = '#020617';
      ctx.fillRect(leftX - 20, batY - 25, 40, 50);

      ctx.lineWidth = 4;
      ctx.strokeStyle = '#0284c7'; // Positive
      ctx.beginPath(); ctx.moveTo(leftX - 16, batY - 12); ctx.lineTo(leftX + 16, batY - 12); ctx.stroke();

      ctx.lineWidth = 8;
      ctx.strokeStyle = '#94a3b8'; // Negative
      ctx.beginPath(); ctx.moveTo(leftX - 9, batY + 12); ctx.lineTo(leftX + 9, batY + 12); ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`Vs: ${data.Vs.toFixed(1)}V`, leftX - 25, batY + 4);

      // 3. Resistors on Branches
      const resY = (topY + botY) / 2;
      drawResistor(b1X, resY, 'R1', Math.round(data.R1), '#22c55e');
      drawResistor(b2X, resY, 'R2', Math.round(data.R2), '#f59e0b');
      drawResistor(b3X, resY, 'R3', Math.round(data.R3), '#a855f7');

      // 4. Node A (Inflow Junction) and Node B (Outflow Junction)
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(nodeAX, topY, 8, 0, Math.PI * 2); ctx.fill();
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Node A (∑I_in = ∑I_out)', nodeAX + 60, topY - 15);

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.arc(nodeAX, botY, 8, 0, Math.PI * 2); ctx.fill();
      ctx.font = 'bold 14px monospace';
      ctx.fillText('Node B', nodeAX, botY + 25);

      // 5. Electron Flow Animations
      // Supply Path (Source -> Node A)
      const supplyPath = [
        { x: leftX, y: batY - 12 },
        { x: leftX, y: topY },
        { x: nodeAX, y: topY }
      ];
      drawDots(supplyPath, data.Itotal, mainAnim);

      // Return Path (Node B -> Source)
      const returnPath = [
        { x: nodeAX, y: botY },
        { x: leftX, y: botY },
        { x: leftX, y: batY + 12 }
      ];
      drawDots(returnPath, data.Itotal, mainAnim);

      // Branch 1 Path (Node A -> R1 -> Node B)
      const b1Path = [
        { x: nodeAX, y: topY }, { x: b1X, y: topY },
        { x: b1X, y: botY }, { x: nodeAX, y: botY }
      ];
      drawDots(b1Path, data.I1, b1Anim);

      // Branch 2 Path (Node A -> R2 -> Node B)
      const b2Path = [
        { x: nodeAX, y: topY }, { x: b2X, y: topY },
        { x: b2X, y: botY }, { x: nodeAX, y: botY }
      ];
      drawDots(b2Path, data.I2, b2Anim);

      // Branch 3 Path (Node A -> R3 -> Node B)
      const b3Path = [
        { x: nodeAX, y: topY }, { x: b3X, y: topY },
        { x: b3X, y: botY }, { x: nodeAX, y: botY }
      ];
      drawDots(b3Path, data.I3, b3Anim);

      requestAnimationFrame(drawCircuit);
    }

    // Attach Event Listeners
    [vsInput, r1Input, r2Input, r3Input].forEach(input => {
      input.addEventListener('input', calculateKCL);
    });

    // Start Lab Simulation
    drawCircuit();
  </script>
</body>
</html>
